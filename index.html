<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI Skills Exercise Manager — practice prompt engineering, get scored by Claude, reviewed by your teacher." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E" />

    <!-- Installable app: see public/manifest.webmanifest and public/sw.js -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Skills" />

    <title>AI Skills Exercise Manager</title>

    <!--
      The theme has to be on <html> before the first paint, or a dark-mode
      reader gets a white flash on every load. ThemeProvider owns the value
      from here on; this only replays the stored choice early enough to matter.
      Kept inline and dependency-free for the same reason — an external file
      would be a second round trip in front of the first frame.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aiskills.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#1c1d22' : '#ffffff');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
